name: CI Pipeline

on:
pull_request:
branches:
- main

jobs:
install_dependencies:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 15

  - name: Install Dependencies
    run: npm install

  - name: Linter
    run: npm run lint

  - name: Formatter
    run: npm run prettier

  - name: Test
    run: CI=true npm run test

  - name: Build
    run: npm run build
```
